name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"

  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run zhiva builder
        uses: wxn0brP/Zhiva-builder@master
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tags: "true"
          nightly: "latest"
          checkout: "false"

  windows-installer:
    needs: build
    permissions:
      contents: write
    uses: wxn0brP/Zhiva-windows/.github/workflows/release.yml@master
    with:
      name: "sol-mail-client"
      file_name: "sol-mail-installer"
      icon: "app.ico"
      release_tag: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

