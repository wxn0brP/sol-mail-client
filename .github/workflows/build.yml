name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"

  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win32
          - os: macos-latest
            target: darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install

      - name: Run zhiva builder
        uses: wxn0brP/Zhiva-builder@master
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tags: "true"
          nightly: "latest"
          checkout: "false"
          target: ${{ matrix.target }}
          publish: "false"

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: zhiva-${{ matrix.target }}
          path: releases/archives/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        run: |
          set -e

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --notes "Auto release for $TAG"
          fi

  windows-installer:
    needs: publish
    permissions:
      contents: write
    uses: wxn0brP/Zhiva-windows/.github/workflows/release.yml@master
    with:
      name: "sol-mail-client"
      file_name: "sol-mail-installer"
      icon: "public/favicon.ico"
      release_tag: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
